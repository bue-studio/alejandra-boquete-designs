:flex;align-items:flex-end;justify-content:space-between;gap:16px 40px;flex-wrap:wrap;margin-bottom:30px}\n\n/* ---------------- announcement ---------------- */\n.ann{height:var(--ann);background:var(--aqua);color:var(--ink);font-size:12.5px;letter-spacing:.02em;display:grid;place-items:center;position:relative;z-index:61;overflow:hidden}\n.ann span{grid-area:1/1;opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease);white-space:nowrap}\n.ann span.on{opacity:1;transform:none}\n.ann a{border-bottom:1px solid rgba(35,35,38,.5);margin-left:8px}\n\n/* ---------------- header (hides on scroll down, returns on scroll up) ---------------- */\n.hdr{position:fixed;top:var(--hdrTop,var(--ann));left:0;right:0;z-index:50;height:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-inline:var(--gut);color:var(--ink);background:transparent;border-bottom:1px solid transparent;transition:background .4s var(--ease),color .4s var(--ease),border-color .4s,transform .55s var(--ease)}\n.hdr.solid,.hdr.hover{background:rgba(246,246,243,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--hair);color:var(--ink)}\n.hdr.light:not(.hover){color:var(--cotton)}\n.hdr.up,.brandwrap.up{transform:translateY(-101%)}\n.hnav{display:flex;gap:30px;align-items:center;font-size:13.5px}\n.hnav.r{gap:18px}\n.hnav.r{justify-content:flex-end}\n.hnav a,.hnav button{position:relative;padding:6px 0}\n.hnav a::after,.hnav button::after{content:\"\";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}\n.hnav a:hover::after,.hnav button:hover::after,.hnav [aria-expanded=\"true\"]::after{transform:scaleX(1)}\n.slot{width:300px;height:12px}\n.menu-btn{display:none}\n.brandwrap{position:fixed;z-index:60;top:var(--hdrTop,var(--ann));left:0;right:0;height:var(--hdr);pointer-events:none;transition:transform .55s var(--ease),opacity .35s var(--ease)}\n.brand{position:absolute;left:50%;top:50%;width:var(--brand);aspect-ratio:510.5/17.95;transform:translate(-50%,-50%);background:var(--ink);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;transition:background-color .4s var(--ease);will-change:transform;pointer-events:auto}\n.brand.light{background:var(--cotton)}\n.mega{position:fixed;left:0;right:0;top:calc(var(--hdrTop,var(--ann)) + var(--hdr));z-index:49;background:rgba(246,246,243,.98);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);padding:36px var(--gut) 44px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .35s var(--ease),transform .5s var(--ease),visibility .35s}\n.mega.on{opacity:1;visibility:visible;transform:none}\n.mega-grid{display:grid;grid-template-columns:repeat(3,minmax(140px,190px)) 1fr;gap:48px}\n.mega h4{margin:0 0 14px;font:400 12.5px/1 var(--sans);font-size-adjust:var(--ta);color:var(--muted)}\n.mega ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font:400 21px/1.15 var(--serif);font-size-adjust:var(--sa)}\n.mega ul a:hover{opacity:.6}\n.mega-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.mega-feat a{display:grid;gap:10px;font-size:13.5px}\n.mega-feat.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px;justify-self:end;width:100%}\n.mega-feat .ph{aspect-ratio:3/4;overflow:hidden;background:var(--tile)}\n.mega-feat img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}\n.mega-feat a:hover img{transform:scale(1.04)}\n.mega-cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;max-width:1500px;margin-inline:auto}\n.mega-cols a{display:grid;gap:14px}\n.mega-cols span{aspect-ratio:3/4;overflow:hidden;background:var(--tile)}\n.mega-cols img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}\n.mega-cols a:hover img{transform:scale(1.04)}\n.mega-cols b =\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"7\" r=\"3.2\"/><path d=\"M3.8 17c.8-3.2 3.3-5 6.2-5s5.4 1.8 6.2 5\"/><\/svg>Account<\/a><\/li>\n    <li><button data-open=\"wish\" data-close><svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M10 17s-6.5-4-6.5-8.6A3.7 3.7 0 0 1 10 6.3a3.7 3.7 0 0 1 6.5 2.1C16.5 13 10 17 10 17z\"/><\/svg>Saved pieces<\/button><\/li>\n    <li><a href=\"#studio\" data-close><svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 16l1.1-3.3A6.2 6.2 0 1 1 7.5 15z\"/><\/svg>Write to Alejandra<\/a><\/li>\n  <\/ul>\n  <div class=\"mm-mark\" aria-hidden=\"true\"><\/div>\n<\/div>\n<div class=\"search\" id=\"search\">\n  <form onsubmit=\"event.preventDefault()\"><label for=\"q\" style=\"position:absolute;left:-9999px\">Search<\/label><input id=\"q\" placeholder=\"Search a piece, a stone or a symbol\"><button type=\"button\" class=\"xbtn\" data-close aria-label=\"Close\"><svg viewBox=\"0 0 18 18\"><path d=\"M3 3l12 12M15 3L3 15\"/><\/svg><\/button><\/form>\n  <div class=\"s-pop\"><span>Often searched<\/span><a href=\"coleccion.html?sy=Evil%20eye\">Evil eye<\/a><a href=\"coleccion.html\">Tennis necklace<\/a><a href=\"coleccion.html\">Turquoise<\/a><a href=\"coleccion.html\">Paperclip chain<\/a><a href=\"coleccion.html\">Pearls<\/a><\/div>\n<\/div>\n<!-- SECTION REFERENCES (mockup only): a numbered dot on every block. Tap it to read \"HOME S3 \u00b7 Hero\" and copy it, so feedback can point to the exact block. -->\n<script>\n(function(){\n  const PAGES = {\n    home: [['#ann','Announcement bar'],['#hdr','Header'],['#hero','Hero'],['#mq','Scrolling text'],['#edit','This season'],['#duo','Protection \u00b7 Sleeping Beauty'],['#diamonds','Fine diamonds'],['#cats','Shop by category'],['#anatomy','What goes into one piece'],['#worn','Charms \u00b7 Silver'],['#gems','Know the stone'],['#studio','The studio'],['.nlb','Newsletter'],['.ftr','Footer']],\n    collection: [['#ann','Announcement bar'],['#hdr','Header'],['.intro','Collection intro'],['#chips','Quick filters'],['#toolbar','Filters and sort'],['#grid','Product grid'],['#grid .band[data-band=\"looks\"]','Worn together'],['#symbols','The symbols'],['section.qa','Questions'],['section[aria-label=\"More to explore\"]','More to explore'],['.nlb','Newsletter'],['.ftr','Footer']],\n    product: [['#ann','Announcement bar'],['#hdr','Header'],['section.pdp','Gallery and buy box'],['#upclose','Up close'],['#details','Details'],['#fit','@#fitH'],['#story','The meaning'],['#theset','@#setH'],['#charms','Build your necklace'],['section[aria-labelledby=\"relH\"]','@#relH'],['#questions','Questions'],['#reviews','Reviews'],['.nlb','Newsletter'],['.ftr','Footer']]\n  };\n  const css = `.sref-layer{position:absolute;left:0;top:0;width:100%;height:0;z-index:44;pointer-events:none}\n  .sref{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:6px;font:500 11px/1 Poppins,system-ui,sans-serif;color:#F6F6F3}\n  .sref b{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#232326;box-shadow:0 0 0 1.5px #F6F6F3,0 4px 12px -4px rgba(35,35,38,.5);font-weight:500;cursor:pointer}\n  .sref span{display:none;height:22px;align-items:center;padding:0 10px;border-radius:999px;background:#232326;box-shadow:0 0 0 1.5px #F6F6F3;white-space:nowrap;letter-spacing:.02em}\n  .sref:hover span,.sref.on span{display:inline-flex}\n  .sref.on b{background:#3CD694;color:#232326}\n  body.sref-off .sref-layer,body.sref-off .sref{display:none}\n  .sref.sref-in{left:4px;top:50%;transform:translateY(-50%);z-index:5}\n  .sref-tog{position:fixed;right:16px;bottom:16px;z-index:61;height:34px;padding:0 14px;border-radius:999px;background:#232326;color:#F6F6F3;font:400 12px/1 Poppins,system-ui,sans-serif;box-shadow:0 10px 24px -12px rgba(35,35,38,.6);display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0}\n  .sref-tog i{width:8px;height:8px;border-radius:50%;background:#3CD694}\n  body.sref-off .sref-tog i{background:#6B6B70}\n  body.mm-on .sref-tog{visibility:hidden}\n  @media (max-width:960px){ .sref-tog{bottom:86px} }`;\n  function page(){ if(document.getElementById('pT')) return 'product'; if(document.getElementById('grid') && document.getElementById('toolbar')) return 'collection'; if(document.getElementById('hero')) return 'home'; return null; }\n  function visible(el){ if(!el || el.hidden || el.closest('[hidden]')) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }\n  let layer, items = [], raf = 0;\n  function build(){\n    const k = page(); if(!k) return;\n    const type = k === 'product' ? ((document.querySelector('#mockSw [aria-pressed=\"true\"]') || {}).textContent || '').trim().toUpperCase() : '';\n    const prefix = k === 'home' ? 'HOME' : k === 'collection' ? 'COLLECTION' : 'PRODUCT' + (type ? ' ' + type : '');\n    items = []; let n = 0;\n    document.querySelectorAll('.sref-in').forEach(x => x.remove());\n    PAGES[k].forEach(([sel, name]) => {\n      document.querySelectorAll(sel).forEach(el => {\n        if(!visible(el)) return; n++;\n        const nm = name.startsWith('@') ? ((document.querySelector(name.slice(1)) || {}).textContent || '').trim() : name;\n        items.push({el, label:`${prefix} S${n} \u00b7 ${nm}`, n});\n      });\n    });\n    /* the announcement bar and the header sit above the page, so their dots go inside them; the rest go on a layer */\n    const dot = (it, i, cls) => `<div class=\"sref${cls}\" data-i=\"${i}\"><b role=\"button\" tabindex=\"0\" aria-label=\"${it.label}\">${it.n}<\/b><span>${it.label}<\/span><\/div>`;\n    layer.innerHTML = items.map((it, i) => INSIDE(it.el) ? '' : dot(it, i, '')).join('');\n    items.forEach((it, i) => { if(INSIDE(it.el)) it.el.insertAdjacentHTML('beforeend', dot(it, i, ' sref-in')); });\n    place();\n  }\n  const INSIDE = el => el.id === 'ann' || el.id === 'hdr';\n  /* copy the reference; inside the one-file mockup the clipboard API can be blocked, so fall back to a hidden field */\n  function copy(t){ const fb = () => { try { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0;left:-99px'; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch(e) {} };\n    try { navigator.clipboard.writeText(t).catch(fb); } catch(e) { fb(); } }\n  /* the home header floats over the hero: dots that would land under it move just below it */\n  function cover(){ const h = document.getElementById('hdr'), a = document.getElementById('ann'); if(!h || getComputedStyle(h).position !== 'fixed') return 0; return (a ? a.offsetHeight : 0) + h.offsetHeight; }\n  function place(){\n    cancelAnimationFrame(raf);\n    raf = requestAnimationFrame(() => { const sx = scrollX, sy = scrollY, c = cover(); [...layer.children].forEach(d => { const it = items[+d.dataset.i]; if(!it) return; const r = it.el.getBoundingClientRect();\n      d.style.left = Math.max(4, r.left + sx - 14) + 'px'; d.style.top = Math.max(r.top + sy + 6, c ? c + 8 : 0) + 'px'; }); });\n  }\n  addEventListener('DOMContentLoaded', () => {\n    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);\n    layer = document.createElement('div'); layer.className = 'sref-layer'; layer.setAttribute('aria-label', 'Section references'); document.body.appendChild(layer);\n    const tog = document.createElement('button'); tog.className = 'sref-tog'; tog.type = 'button'; tog.innerHTML = '<i><\/i>Sections'; document.body.appendChild(tog);\n    tog.addEventListener('click', () => document.body.classList.toggle('sref-off'));\n    document.addEventListener('click', e => { const d = e.target.closest('.sref'); if(!d) return; e.preventDefault(); e.stopPropagation(); const on = !d.classList.contains('on'); document.querySelectorAll('.sref').forEach(x => x.classList.remove('on')); if(on){ d.classList.add('on'); const t = items[+d.dataset.i].label; copy(t); } }, true);\n    document.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.sref')){ e.preventDefault(); e.target.click(); } });\n    setTimeout(build, 300);\n    let t; const again = () => { clearTimeout(t); t = setTimeout(build, 250); };\n    new ResizeObserver(again).observe(document.body);\n    addEventListener('resize', again); addEventListener('load', again);\n    const g = document.getElementById('grid'); if(g) new MutationObserver(again).observe(g, {childList:true});\n    document.addEventListener('click', e => { if(e.target.closest('[data-type], .more-btn, summary, [data-o]')) again(); });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  const mm = document.getElementById('mmenu'), btn = document.getElementById('menuBtn');\n  if(!mm || !btn) return;\n  function build(){\n    const SECT = [['shop','Shop'],['colls','Collections'],['explore','Explore']];\n    document.getElementById('mmAcc').innerHTML = SECT.map(([id, name]) => {\n      const m = document.getElementById('mega-' + id); if(!m) return '';\n      let groups = [...m.querySelectorAll('.mega-grid > div:not(.mega-feat)')].map(d => ({h:(d.querySelector('h4') || {}).textContent || '', links:[...d.querySelectorAll('a')].map(a => [a.getAttribute('href'), a.textContent.trim()])}));\n      if(id === 'colls') groups = [{h:'', links:[...m.querySelectorAll('a')].map(a => [a.getAttribute('href'), ((a.querySelector('b') || a).firstChild || {}).textContent || a.textContent])}];\n      return `<details name=\"mm\"><summary>${name}<i aria-hidden=\"true\"><\/i><\/summary><div class=\"mm-in\">${groups.map(g => `<div class=\"mm-g\">${g.h ? `<h4>${g.h}<\/h4>` : ''}<ul>${g.links.map(([h, t]) => `<li><a href=\"${h}\" data-close>${t.trim()}<\/a><\/li>`).join('')}<\/ul><\/div>`).join('')}<\/div><\/details>`;\n    }).join('');\n  }\n  /* the bag count shows only when there is something in the bag */\n  function bagBadge(){ const n = document.getElementById('bagN'); if(n) n.hidden = (n.textContent.trim() === '0' || !n.textContent.trim()); }\n  addEventListener('DOMContentLoaded', () => {\n    build(); bagBadge();\n    const n = document.getElementById('bagN'); if(n) new MutationObserver(bagBadge).observe(n, {childList:true, characterData:true, subtree:true});\n    if(typeof panels !== 'undefined' && panels.menu) return;   /* the home drives the menu with its own panels */\n    const hdr = document.getElementById('hdr');\n    const open = () => { mm.classList.add('on'); document.body.classList.add('locked', 'mm-on'); btn.setAttribute('aria-expanded', true); btn.textContent = 'Close'; if(hdr) hdr.classList.remove('up'); document.body.classList.remove('hdr-up'); };\n    const close = () => { mm.classList.remove('on'); document.body.classList.remove('locked', 'mm-on'); btn.setAttribute('aria-expanded', false); btn.textContent = 'Menu'; };\n    btn.addEventListener('click', () => mm.classList.contains('on') ? close() : open());\n    /* search, on pages that do not have the home's panels */\n    const sp = document.getElementById('search');\n    if(sp){ document.addEventListener('click', e => { if(e.target.closest('[data-open=\"search\"]')){ close(); sp.classList.add('on'); setTimeout(() => { const q = document.getElementById('q'); if(q) q.focus(); }, 350); } else if(e.target.closest('#search [data-close]') || (sp.classList.contains('on') && !e.target.closest('#search'))) sp.classList.remove('on'); });\n      addEventListener('keydown', e => { if(e.key === 'Escape'){ sp.classList.remove('on'); close(); } }); }\n    mm.addEventListener('click', e => { if(e.target.closest('[data-close]')) close(); });\n  });\n})();\n<\/script>\n\n<main>\n\n<!-- HERO -->\n<section class=\"hero\" id=\"hero\">\n  <figure class=\"l\"><img src=\"https://www.alejandraboquetedesigns.com/cdn/shop/files/slide_2_1280x_a6462db0-a178-43f4-a8f7-6711c644c9c5.webp?v=1772829248&width=1600\" alt=\"Model in a pale blue jumpsuit wearing long gold charm necklaces\" style=\"ob d:#3CD694;color:#232326}\n  body.sref-off .sref-layer,body.sref-off .sref{display:none}\n  .sref.sref-in{left:4px;top:50%;transform:translateY(-50%);z-index:5}\n  .sref-tog{position:fixed;right:16px;bottom:16px;z-index:61;height:34px;padding:0 14px;border-radius:999px;background:#232326;color:#F6F6F3;font:400 12px/1 Poppins,system-ui,sans-serif;box-shadow:0 10px 24px -12px rgba(35,35,38,.6);display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0}\n  .sref-tog i{width:8px;height:8px;border-radius:50%;background:#3CD694}\n  body.sref-off .sref-tog i{background:#6B6B70}\n  body.mm-on .sref-tog{visibility:hidden}\n  @media (max-width:960px){ .sref-tog{bottom:86px} }`;\n  function page(){ if(document.getElementById('pT')) return 'product'; if(document.getElementById('grid') && document.getElementById('toolbar')) return 'collection'; if(document.getElementById('hero')) return 'home'; return null; }\n  function visible(el){ if(!el || el.hidden || el.closest('[hidden]')) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }\n  let layer, items = [], raf = 0;\n  function build(){\n    const k = page(); if(!k) return;\n    const type = k === 'product' ? ((document.querySelector('#mockSw [aria-pressed=\"true\"]') || {}).textContent || '').trim().toUpperCase() : '';\n    const prefix = k === 'home' ? 'HOME' : k === 'collection' ? 'COLLECTION' : 'PRODUCT' + (type ? ' ' + type : '');\n    items = []; let n = 0;\n    document.querySelectorAll('.sref-in').forEach(x => x.remove());\n    PAGES[k].forEach(([sel, name]) => {\n      document.querySelectorAll(sel).forEach(el => {\n        if(!visible(el)) return; n++;\n        const nm = name.startsWith('@') ? ((document.querySelector(name.slice(1)) || {}).textContent || '').trim() : name;\n        items.push({el, label:`${prefix} S${n} \u00b7 ${nm}`, n});\n      });\n    });\n    /* the announcement bar and the header sit above the page, so their dots go inside them; the rest go on a layer */\n    const dot = (it, i, cls) => `<div class=\"sref${cls}\" data-i=\"${i}\"><b role=\"button\" tabindex=\"0\" aria-label=\"${it.label}\">${it.n}<\/b><span>${it.label}<\/span><\/div>`;\n    layer.innerHTML = items.map((it, i) => INSIDE(it.el) ? '' : dot(it, i, '')).join('');\n    items.forEach((it, i) => { if(INSIDE(it.el)) it.el.insertAdjacentHTML('beforeend', dot(it, i, ' sref-in')); });\n    place();\n  }\n  const INSIDE = el => el.id === 'ann' || el.id === 'hdr';\n  /* copy the reference; inside the one-file mockup the clipboard API can be blocked, so fall back to a hidden field */\n  function copy(t){ const fb = () => { try { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0;left:-99px'; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch(e) {} };\n    try { navigator.clipboard.writeText(t).catch(fb); } catch(e) { fb(); } }\n  /* the home header floats over the hero: dots that would land under it move just below it */\n  function cover(){ const h = document.getElementById('hdr'), a = document.getElementById('ann'); if(!h || getComputedStyle(h).position !== 'fixed') return 0; return (a ? a.offsetHeight : 0) + h.offsetHeight; }\n  function place(){\n    cancelAnimationFrame(raf);\n    raf = requestAnimationFrame(() => { const sx = scrollX, sy = scrollY, c = cover(); [...layer.children].forEach(d => { const it = items[+d.dataset.i]; if(!it) return; const r = it.el.getBoundingClientRect();\n      d.style.left = Math.max(4, r.left + sx - 14) + 'px'; d.style.top = Math.max(r.top + sy + 6, c ? c + 8 : 0) + 'px'; }); });\n  }\n  addEventListener('DOMContentLoaded', () => {\n    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);\n    layer = document.createElement('div'); layer.className = 'sref-layer'; layer.setAttribute('aria-label', 'Section references'); document.body.appendChild(layer);\n    const tog = document.createElement('button'); tog.className = 'sref-tog'; tog.type = 'button'; tog.innerHTML = '<i><\/i>Sections'; document.body.appendChild(tog);\n    tog.addEventListener('click', () => document.body.classList.toggle('sref-off'));\n    document.addEventListener('click', e => { const d = e.target.closest('.sref'); if(!d) return; e.preventDefault(); e.stopPropagation(); const on = !d.classList.contains('on'); document.querySelectorAll('.sref').forEach(x => x.classList.remove('on')); if(on){ d.classList.add('on'); const t = items[+d.dataset.i].label; copy(t); } }, true);\n    document.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.sref')){ e.preventDefault(); e.target.click(); } });\n    setTimeout(build, 300);\n    let t; const again = () => { clearTimeout(t); t = setTimeout(build, 250); };\n    new ResizeObserver(again).observe(document.body);\n    addEventListener('resize', again); addEventListener('load', again);\n    const g = document.getElementById('grid'); if(g) new MutationObserver(again).observe(g, {childList:true});\n    document.addEventListener('click', e => { if(e.target.closest('[data-type], .more-btn, summary, [data-o]')) again(); });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  const mm = document.getElementById('mmenu'), btn = document.getElementById('menuBtn');\n  if(!mm || !btn) return;\n  function build(){\n    const SECT = [['shop','Shop'],['colls','Collections'],['explore','Explore']];\n    document.getElementById('mmAcc').innerHTML = SECT.map(([id, name]) => {\n      const m = document.getElementById('mega-' + id); if(!m) return '';\n      let groups = [...m.querySelectorAll('.mega-grid > div:not(.mega-feat)')].map(d => ({h:(d.querySelector('h4') || {}).textContent || '', links:[...d.querySelectorAll('a')].map(a => [a.getAttribute('href'), a.textContent.trim()])}));\n      if(id === 'colls') groups = [{h:'', links:[...m.querySelectorAll('a')].map(a => [a.getAttribute('href'), ((a.querySelector('b') || a).firstChild || {}).textContent || a.textContent])}];\n      return `<details name=\"mm\"><summary>${name}<i aria-hidden=\"true\"><\/i><\/summary><div class=\"mm-in\">${groups.map(g => `<div class=\"mm-g\">${g.h ? `<h4>${g.h}<\/h4>` : ''}<ul>${g.links.map(([h, t]) => `<li><a href=\"${h}\" data-close>${t.trim()}<\/a><\/li>`).join('')}<\/ul><\/div>`).join('')}<\/div><\/details>`;\n    }).join('');\n  }\n  /* the bag count shows only when there is something in the bag */\n  function bagBadge(){ const n = document.getElementById('bagN'); if(n) n.hidden = (n.textContent.trim() === '0' || !n.textContent.trim()); }\n  addEventListener('DOMContentLoaded', () => {\n    build(); bagBadge();\n    const n = document.getElementById('bagN'); if(n) new MutationObserver(bagBadge).observe(n, {childList:true, characterData:true, subtree:true});\n    if(typeof panels !== 'undefined' && panels.menu) return;   /* the home drives the menu with its own panels */\n    const hdr = document.getElementById('hdr');\n    const open = () => { mm.classList.add('on'); document.body.classList.add('locked', 'mm-on'); btn.setAttribute('aria-expanded', true); btn.textContent = 'Close'; if(hdr) hdr.classList.remove('up'); document.body.classList.remove('hdr-up'); };\n    const close = () => { mm.classList.remove('on'); document.body.classList.remove('locked', 'mm-on'); btn.setAttribute('aria-expanded', false); btn.textContent = 'Menu'; };\n    btn.addEventListener('click', () => mm.classList.contains('on') ? close() : open());\n    /* search, on pages that do not have the home's panels */\n    const sp = document.getElementById('search');\n    if(sp){ document.addEventListener('click', e => { if(e.target.closest('[data-open=\"search\"]')){ close(); sp.classList.add('on'); setTimeout(() => { const q = document.getElementById('q'); if(q) q.focus(); }, 350); } else if(e.target.closest('#search [data-close]') || (sp.classList.contains('on') && !e.target.closest('#search'))) sp.classList.remove('on'); });\n      addEventListener('keydown', e => { if(e.key === 'Escape'){ sp.classList.remove('on'); close(); } }); }\n    mm.addEventListener('click', e => { if(e.target.closest('[data-close]')) close(); });\n  });\n})();\n<\/script>\n\n<main>\n<nav class=\"crumbs wrap\" aria-label=\"Breadcrumb\"><a href=\"home.html\">Home<\/a><span aria-hidden=\"true\">/<\/span><a href=\"#\">Collections<\/a><span aria-hidden=\"true\">/<\/span><span aria-current=\"page\">Protection<\/span><\/nav>\n\n<!-- INTRO: name, one-line meaning, then the facts (count, metals, stones, price range) -->\n<section class=\"intro wrap\">\n  <div class=\"intro-txt\">\n    <h1>Protection<\/h1>\n    <p class=\"lead\" id=\"lead\">Evil eyes and hamsas, worn for centuries to keep harm away.<\/p>\n    <p class=\"facts\" id=\"facts\"><\/p>\n  <\/div>\n  <figure class=\"intro-img\">\n    <span class=\"still\"><img id=\"introA\" alt=\"Evil eye pendant in 14K gold with blue sapphires and diamonds\"><\/span>\n    <span><img id=\"introB\" alt=\"Multi evil eye pendant worn with a white blazer\"><\/span>\n  <\/figure>\n<\/section>\n\n<!-- QUICK ACCESS: symbols inside the collection, then sibling collections -->\n<div class=\"chips wrap\" id=\"chips\" aria-label=\"Quick filters\"><\/div>\n\n<!-- TOOLBAR -->\n<div class=\"toolbar\" id=\"toolbar\">\n  <div class=\"tb wrap\" style=\"position:relative\">\n    <div class=\"tb-l\">\n      <button class=\"all-btn\" data-open=\"filters\"><svg viewBox=\"0 0 16 16\"><path d=\"M2 4h12M4 8h8M6 12h4\"/><\/svg>Filter<span class=\"n\" id=\"nAll\" hidden><\/span><\/button>\n      <span id=\"facetBtns\" style=\"display:contents\"><\/span>\n    <\/div>\n    <div class=\"tb-r\">\n      <span class=\"count\" id=\"count\"><\/span>\n      <label class=\"sort\"><span class=\"lbl\">Sort<\/span>\n        <select id=\"sort\" aria-label=\"Sort by\">\n          <option value=\"featured\">Featured<\/option>\n          <option value=\"best\">Best selling<\/option>\n          <opti vil eye<\/h3>\n      <p>One of the oldest protective symbols in the Mediterranean and the Middle East. The eye looks back at envy and bad intentions so they never reach the person who wears it. Blue is the traditional color, which is why so many of these pieces carry sapphires or turquoise.<\/p>\n      <a href=\"#grid\" class=\"tlink\" data-shop-sy=\"Evil eye\">Shop the evil eye<\/a>\n    <\/article>\n    <article class=\"sym\">\n      <figure class=\"ph\" style=\"--z:1.9;--o:50% 66%\"><img id=\"symHand\" alt=\"Hamsa pendant with a malachite center, close up\" loading=\"lazy\"><\/figure>\n      <h3>The hamsa<\/h3>\n      <p>An open hand that has stood for protection and blessing for thousands of years. Worn with the fingers up, it is traditionally a shield against the evil eye. Worn with the fingers down, it is believed to invite good fortune and abundance.<\/p>\n      <a href=\"#grid\" class=\"tlink\" data-shop-sy=\"Hamsa\">Shop the hamsa<\/a>\n    <\/article>\n  <\/div>\n<\/section>\n<section class=\"qa sec wrap\" aria-label=\"Questions\">\n  <div><h2>Questions<\/h2><p class=\"sub\">About the pieces, chains, shipping and returns.<\/p><\/div>\n  <div class=\"faq\" id=\"faq\"><\/div>\n<\/section>\n\n<!-- RELATED -->\n<section class=\"sec wrap line-top\" style=\"padding-top:clamp(40px,4.5vw,72px)\" aria-label=\"More to explore\">\n  <div class=\"head\"><h2 class=\"title\" style=\"font-size:clamp(32px,3.2vw,48px)\">More to explore<\/h2><\/div>\n  <div class=\"rel\" id=\"rel\"><\/div>\n<\/section>\n\n<\/main>\n\n<!-- NEWSLETTER (carbon band) -->\n<section class=\"nlb\" aria-label=\"Newsletter\">\n  <div class=\"wrap news\">\n    <div><p class=\"k\">The list<\/p><h2>New pieces and private sales, a few times a year.<\/h2><\/div>\n    <div>\n      <form id=\"nl\"><label for=\"nlEmail\" style=\"position:absolute;left:-9999px\">Email address<\/label><input id=\"nlEmail\" type=\"email\" placeholder=\"Your email address\" autocomplete=\"email\"><button type=\"submit\">Subscri =\"M1 1l8 8M9 1L1 9\"/><\/svg>';\n\n/* ---------- facets (built from the product data, counts update live) ---------- */\nconst PRICE = [['Under $500',0,500],['$500 to $1,000',500,1000],['$1,000 to $2,000',1000,2000],['Over $2,000',2000,1e9]];\nconst FACETS = [\n  {k:'sy', n:'Symbol', get:p => [p.sy]},\n  {k:'ty', n:'Type', get:p => [p.ty]},\n  {k:'st', n:'Stone', get:p => p.st},\n  {k:'mat', n:'Metal', get:p => p.mat ? [p.mat] : []},\n  {k:'pr', n:'Price', get:p => PRICE.filter(([,lo,hi]) => p.p >= lo && p.p < hi).map(r => r[0]), order:PRICE.map(r => r[0])},\n];\nconst SWATCH = {'14K gold':'linear-gradient(135deg,#EAD49B,#C7A257)','Sterling silver':'linear-gradient(135deg,#E5E6E8,#A6A9AE)'};\nconst sel = {}; FACETS.forEach(f => sel[f.k] = new Set());\nlet sortBy = 'featured', shown = 0, more = 0, dens = 4;   /* more = how many times Load more was pressed */\nconst cols = () => innerWidth <= 960 ? 2 : innerWidth <= 1180 ? 3 : dens;\n/* counted in rows, never in pieces: 2 rows, the band, 3 rows, then 3 rows per Load more, whatever the columns */\nconst pageSize = () => cols() * 3;\n\nfunction matches(p, skip){\n  return FACETS.every(f => f.k === skip || !sel[f.k].size || f.get(p).some(v => sel[f.k].has(v)));\n}\nfunction values(f){\n  const all = new Map();\n  P.forEach(p => f.get(p).forEach(v => all.set(v, 0)));\n  P.filter(p => matches(p, f.k)).forEach(p => f.get(p).forEach(v => all.set(v, all.get(v) + 1)));\n  let keys = [...all.keys()];\n  keys = f.order ? f.order.filter(k => all.has(k)) : keys.sort((a,b) => all.get(b) - all.get(a) || a.localeCompare(b));\n  return keys.map(v => [v, all.get(v)]);\n}\nfunction optsHTML(f){\n  return `<div class=\"opts\">${values(f).map(([v,c]) => `<label class=\"opt${c ? '' : ' zero'}\"><input type=\"checkbox\" data-f=\"${f.k}\" value=\"${v}\" ${sel[f.k].has(v) ? 'checked' : ''}>${f.k === 'mat' ? `<i class=\"sw\" style=\"background:${SWATCH[v]}\"><\/i>` : ''}${v}<span class=\"c\">${c}<\/span><\/label>`).join('')}<\/div>`;\n}\n\n/* \/svg>Shop the look <small>${l.items.length} ${l.items.length > 1 ? 'pieces' : 'piece'}<\/small><\/span><\/button>`).join('')}<\/div>\n  <\/div>`;\n}\n/* ---------- render ---------- */\nconst SORTS = {featured:(a,b) => a.o - b.o, best:(a,b) => a.o - b.o, new:(a,b) => b.n - a.n, asc:(a,b) => a.p - b.p || a.o - b.o, desc:(a,b) => b.p - a.p || a.o - b.o};\nfunction render(keepScroll){\n  shown = cols() * (5 + 3 * more);\n  const list = P.filter(p => matches(p)).sort(SORTS[sortBy]);\n  const vis = list.slice(0, shown);\n  let html = '';\n  vis.forEach((p,i) => {\n    html += card(p);\n    if(i === cols()*2 - 1 && list.length > cols()*2) html += bandLooks();\n  });\n  if(!list.length) html = `<div class=\"none\"><b>No pieces match these filters.<\/b>Try removing one, or <button class=\"clear\" data-clear>clear all filters<\/button>.<\/div>`;\n  const g = $('#grid'); g.innerHTML = html; g.classList.toggle('d3', dens === 3);\n  $('#count').textContent = `${list.length} ${list.length === 1 ? 'piece' : 'pieces'}`;\n  $('#more').innerHTML = list.length > vis.length\n    ? `<p>Showing ${vis.length} of ${list.length}<\/p><span class=\"bar\"><i style=\"width:${vis.length/list.length*100}%\"><\/i><\/span><button class=\"btn-line\" id=\"loadMore\">Load ${Math.min(pageSize(), list.length - vis.length)} more<\/button>`\n    : (list.length ? `<p>Showing all ${list.length} pieces<\/p>` : '');\n  /* applied filters overview */\n  const tags = FACETS.flatMap(f => [...sel[f.k]].map(v => `<span class=\"tag\">${v}<button data-rm=\"${f.k}|${v}\" aria-label=\"Remove ${v}\">${X9}<\/button><\/span>`));\n  $('#applied').innerHTML = tags.length ? tags.join('') + '<button class=\"clear\" data-clear>Clear all<\/button>' : '';\n  const n = FACETS.reduce((s,f) => s + sel[f.k].size, 0);\n  $('#nAll').hidden = !n; $('#nAll').textContent = n;\n  $('#facetBtns').innerHTML = FACETS.map(f => `<button class=\"facet-btn\" data-pop=\"${f.k}\" aria-expanded=\"${openPop === f.k}\">${f.n}${sel[f.k].size ? `<span class=\"n\">${sel[f.k].size}<\/span>` : ''}<svg viewBox=\"0 0 10 10\"><path d=\"M1 3l4 4 4-4\"/><\/svg><\/button>`).join('');\n  $('#facets').innerHTML = FACETS.map(f => `<details ${sel[f.k].size || f.k === 'sy' || f.k === 'ty' ? 'open' : ''}><summary>${f.n}${sel[f.k].size ? `<em>${sel[f.k].size} selected<\/em>` : ''}<\/summary>${optsHTML(f)}<\/details>`).join('');\n  $('#fdShow').textContent = `Show ${list.length} ${list.length === 1 ? 'piece' : 'pieces'}`;\n  if(openPop) paintPop(openPop);\n  $$('#chips .chip[data-sy]').forEach(c => c.setAttribute('aria-pressed', c.dataset.sy === '' ? !sel.sy.size : (sel.sy.size === 1 && sel.sy.has(c.dataset.sy))));\n  $$('#chips .chip[data-pr]').forEach(c => c.setAttribute('aria-pressed', sel.pr.has(c.dataset.pr)));\n  setLead(sel.sy.size === 1 ? [...sel.sy][0] : '');\n  /* the app preview runs the page in a sandbox where the URL can't change; on the real site it can */\n  try { history.replaceState(null, '', location.pathname + qs()); } catch(e) {}\n}\n/* the line under the title speaks about the symbol in view */\nconst LEAD = {'':'Evil eyes and hamsas, worn for centuries to keep harm away.',\n  'Evil eye':'The eye looks back at envy and bad intentions, so they never reach the person who wears it.',\n  'Hamsa':'An open hand for protection and blessing. Fingers up to shield, fingers down to draw good fortune in.',\n  'Protection coin':'Several protective symbols gathered on a single coin.'};\nlet leadNow = '';\nfunction setLead(k){\n  if(k === leadNow) return; leadNow = k; const el = $('#lead');\n  el.classList.add('swap'); setTimeout(() => { el.textContent = LEAD[k] || LEAD['']; el.classList.remove('swap'); }, 220);\n}\n/* filters live in the URL, so a filtered view can be shared and indexed on purpose */\nfunction qs(){\n  const parts = FACETS.filter(f => sel[f.k].size).map(f => `${f.k}=${encodeURIComponent([...sel[f.k]].join(','))}`);\n  if(sortBy !== 'featured') parts.push('sort=' + sortBy);\n  return parts.length ? '?' + parts.join('&') : '';\n}\n\n/* ---------- facet popovers ---------- */\nlet openPop = null;\nfunction paintPop(k){\n  const f = FACETS.find(x => x.k === k), pop = $('#pop'), btn = $(`[data-pop=\"${k}\"]`);\n  pop.innerHTML = optsHTML(f) + `<div class=\"foot\"><button class=\"clear\" data-clearf=\"${k}\">Clear<\/button><span>${P.filter(p => matches(p)).length} pieces<\/span><\/div>`;\n  const tb = $('.tb').getBoundingClientRect(), b = btn.getBoundingClientRect();\n  pop.style.setProperty('--px', (b.left - tb.left - 20) + 'px'); pop.classList.add('on');\n}\nfunction closePop(){ openPop = null; $('#pop').classList.remove('on'); $$('.facet-btn').forEach(b => b.setAttribute('aria-expanded', false)); }\n\ndocument.addEventListener('click', e => {\n  const pb = e.target.closest('[data-pop]');\n  if(pb){ const k = pb.dataset.pop; if(openPop === k){ closePop(); } else { openPop = k; $$('.facet-btn').forEach(b => b.setAttribute('aria-expanded', b === pb)); paintPop(k); } return; }\n  if(openPop && !e.target.closest('#pop')) closePop();\n  const rm = e.target.closest('[data-rm]'); if(rm){ const [k,v] = rm.dataset.rm.split('|'); sel[k].delete(v); more = 0; render(); return; }\n  if(e.target.closest('[data-clear]') || e.target.id === 'fdClear'){ FACETS.forEach(f => sel[f.k].clear()); more = 0; render(); return; }\n  const cf = e.target.closest('[data-clearf]'); if(cf){ sel[cf.dataset.clearf].clear(); render(); return; }\n  const chip = e.target.closest('.chip[data-sy]'); if(chip){ sel.sy.clear(); if(chip.dataset.sy) sel.sy.add(chip.dataset.sy); more = 0; render(); return; }\n  const prc = e.target.closest('.chip[data-pr]'); if(prc){ const v = prc.dataset.pr; sel.pr.has(v) ? sel.pr.delete(v) : (sel.pr.clear(), sel.pr.add(v)); more = 0; render(); return; }\n  const ss = e.target.closest('[data-shop-sy]'); if(ss){ e.preventDefault(); sel.sy.clear(); sel.sy.add(ss.dataset.shopSy); more = 0; render(); scrollTo({top:$('#chips').getBoundingClientRect().top + scrollY - 20, behavior:'sm umns:20px 52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;cursor:pointer}\n.ao input{position:absolute;opacity:0;pointer-events:none}\n.ao .bx{width:20px;height:20px;border-radius:5px;border:1px solid var(--stone);display:grid;place-items:center;transition:background .25s,border-color .25s}\n.ao .bx svg{width:12px;height:12px;stroke:var(--cotton);stroke-width:2;fill:none;opacity:0;transition:opacity .2s}\n.ao.on .bx{background:var(--ink);border-color:var(--ink)}\n.ao.on .bx svg{opacity:1}\n.ao input:focus-visible+.bx{outline:1px solid var(--ink);outline-offset:3px}\n.ao .im{position:relative;width:52px;aspect-ratio:1;background:var(--tile);border-radius:3px;overflow:hidden}\n.ao .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%;mix-blend-mode:multiply}\n.ao b{display:block;font-weight:400;font-size:13.5px;line-height:1.3}\n.ao small{display:block;font-size:12px;color:var(--muted);line-height:1.4}\n.ao .pr{font-size:13.5px;white-space:nowrap}\n.ao .more{display:none;gap:12px;padding:0 14px 14px 100px}\n.ao.on .more{display:grid;animation:rise .4s var(--ease)}\n@keyframes rise{from{opacity:0;transform:translateY(5px)}}\n.ao .dots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.ao .dots button{position:relative;width:40px;height:40px;border-radius:3px;background:var(--tile);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(35,35,38,.06);outline:1px solid transparent;outline-offset:2px;transition:outline-color .3s}\n.ao .dots button img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4%;mix-blend-mode:multiply;pointer-events:none}\n.ao .dots button:hover{outline-color:var(--stone)}\n.ao .dots button[aria-checked=\"true\"]{outline-color:var(--ink)}\n.ao .dots span{flex-basis:100%;font-size:12px;color:var(--muted)}\n.ao .dots em{font-style:normal;color:var(--aqua-deep)}\n.ao .pills button{height:32px;min-width:48px;font-size:12.5px;padding:0 12px}\n.addon .seeall{justify-self:st ateY(-1px)}\n.ship.mto .dot{background:var(--cyan);box-shadow:0 0 0 4px rgba(60,204,214,.22)}\n.ship small{display:block;color:var(--muted);font-size:12.5px}\n.svc{list-style:none;margin:0;padding:18px 0 0;border-top:1px solid var(--hair);display:grid;gap:13px;font-size:13.5px}\n.svc li{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start}\n.svc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}\n.svc a,.svc .lk{border-bottom:1px solid var(--hair)}\n.svc .lk{font-size:inherit;padding:0}\n\n/* ---------- sticky bars ---------- */\n.pbar{position:fixed;left:0;right:0;top:var(--hdr);z-index:40;background:rgba(246,246,243,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);transform:translateY(-130%);transition:transform .5s var(--ease),top .55s var(--ease)}\nbody.hdr-up .pbar{top:0}\n.pbar.on{transform:none}\n.pbar .in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:24px;align-items:center;height:64px}\n.pbar .pi{display:flex;gap:12px;align-items:center;min-width:0}\n.pbar .pi span{width:42px;height:42px;background:var(--tile);flex:none;position:relative;overflow:hidden;border-radius:3px}\n.pbar .pi img,.bsum li span.main img,.ao .im img.t{scale:var(--tz,1);transform-origin:var(--tfo,50% 50%)}\n.pbar .pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4%;mix-blend-mode:multiply}\n.pbar .pi b{display:block;font:400 17px/1.1 var(--serif);font-size-adjust:var(--sa);white-space:nowrap}\n.pbar .pi small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.pbar nav{display:flex;gap:28px;font-size:13.5px}\n.pbar nav a{position:relative;color:var(--muted);padding:6px 0;transition:color .3s}\n.pbar nav a::after{content:\"\";position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease) :var(--tile);overflow:hidden;margin:0}\n.dv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%;mix-blend-mode:multiply}\n.dv.cover img{object-fit:cover;object-position:var(--fo,50% 30%);padding:0;mix-blend-mode:normal;scale:var(--z,1);transform-origin:var(--fo,50% 30%)}\n.dv figcaption{position:absolute;left:16px;bottom:16px;height:28px;padding:0 12px;border-radius:999px;background:rgba(246,246,243,.92);display:inline-flex;align-items:center;font-size:12px}\n.dt .lead{margin:22px 0 0;font:400 clamp(19px,1.6vw,23px)/1.45 var(--serif);font-size-adjust:var(--sa);max-width:30ch}\n.dt>p{color:var(--muted);max-width:52ch}\n#dgroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,3vw,48px);margin-top:30px}\n.dg{padding:24px 0;border-top:1px solid var(--hair)}\n.dg-care:nth-child(odd){grid-column:1/-1}\n.dg-care:nth-child(even) .care{grid-template-columns:minmax(0,1fr)}\n.dg h3{margin:0 0 18px;font:400 21px/1.2 var(--serif);font-size-adjust:var(--sa)}\n.dg dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}\n.dg dl div{display:grid;gap:2px}\n.dg dt{font-size:12px;color:var(--muted)}\n.dg dd{margin:0;font-size:14px}\n.care{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}\n.care li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;font-size:13.5px;line-height:1.45}\n.care li span{width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center}\n.legend{margin:0;padding-top:20px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted)}\n\n/* ---------- size and fit: one illustration per kind of piece, filled from the product data ---------- */\n.fit{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,110px);align-items:center}\n.fig{position:relative;background:var(--tile);aspect-ratio:1;overflow:hidden}\n.fig svg{position:absolute;inset:0;width:100%;height:100%}\n.fig .ghost{fill:none;stroke:rgba(35,35,38,.16);stroke-width:1;stroke-dasharray:1 3.2;stroke-linecap:round;cursor:pointer}\n.fig .lab{font:400 11px var(--sans);fill:var(--muted);cursor:pointer}\n.fig .lab.on{fill:var(--ink)}\n.fig .dimx{stroke:var(--ink);stroke-width:1;fill:none}\n.fig .dimt{font:400 12px var(--sans);fill:var(--ink)}\n.fit.compact .fig{aspect-ratio:3/2}\n.fit.compact .cap{min-height:0}\n.fit .ctrl{margin-top:28px;display:grid;gap:18px}\n.fit .ctrl:empty,#rgUse:empty{display:none}\n.fit .pills button{min-width:62px;height:40px}\n.fit .cap{margin:22px 0 0;font:400 22px/1.35 var(--serif);font-size-adjust:var(--sa);max-width:28ch;min-height:2.7em}\n.fit .cap small{display:block;margin-top:10px;font:400 13px/1.5 var(--sans);font-size-adjust:var(--ta);color:var(--muted)}\n.range{display:grid;gap:10px}\n.range label{display:flex;justify-content:space-between;font-size:13.5px}\n.range label b{font-weight:400}\n.range input{width:100%;accent-color:var(--ink)}\n.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}\n.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:13.5px;color:#55555a;counter-increment:s}\n.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1px solid var(--stone);display:grid;place-items:center;font-size:11.5px;color:var(--ink)}\n.stbl{width:100%;border-collapse:collapse;font-size:13px}\n.stbl th,.stbl td{text-align:left;padding:9px 0;border-bottom:1px solid var(--hair);font-weight:400}\n.stbl th{color:var(--muted);font-size:12px}\n.stbl tr.on td{color:var(--ink);font-weight:500}\n.stbl tr.na td{color:#a3a3a7}\n.useb{justify-self:start;height:40px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--cotton);font-size:13px}\n\n/* ---------- story: the symbol when there is one, the studio otherwise ---------- */\n.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--tile);min-height:min( bsolute;left:-9999px\">Search<\/label><input id=\"q\" placeholder=\"Search a piece, a stone or a symbol\"><button type=\"button\" class=\"xbtn\" data-close aria-label=\"Close\"><svg viewBox=\"0 0 18 18\"><path d=\"M3 3l12 12M15 3L3 15\"/><\/svg><\/button><\/form>\n  <div class=\"s-pop\"><span>Often searched<\/span><a href=\"coleccion.html?sy=Evil%20eye\">Evil eye<\/a><a href=\"coleccion.html\">Tennis necklace<\/a><a href=\"coleccion.html\">Turquoise<\/a><a href=\"coleccion.html\">Paperclip chain<\/a><a href=\"coleccion.html\">Pearls<\/a><\/div>\n<\/div>\n<!-- SECTION REFERENCES (mockup only): a numbered dot on every block. Tap it to read \"HOME S3 \u00b7 Hero\" and copy it, so feedback can point to the exact block. -->\n<script>\n(function(){\n  const PAGES = {\n    home: [['#ann','Announcement bar'],['#hdr','Header'],['#hero','Hero'],['#mq','Scrolling text'],['#edit','This season'],['#duo','Protection \u00b7 Sleeping Beauty'],['#diamonds','Fine diamonds'],['#cats','Shop by category'],['#anatomy','What goes into one piece'],['#worn','Charms \u00b7 Silver'],['#gems','Know the stone'],['#studio','The studio'],['.nlb','Newsletter'],['.ftr','Footer']],\n    collection: [['#ann','Announcement bar'],['#hdr','Header'],['.intro','Collection intro'],['#chips','Quick filters'],['#toolbar','Filters and sort'],['#grid','Product grid'],['#grid .band[data-band=\"looks\"]','Worn together'],['#symbols','The symbols'],['section.qa','Questions'],['section[aria-label=\"More to explore\"]','More to explore'],['.nlb','Newsletter'],['.ftr','Footer']],\n    product: [['#ann','Announcement bar'],['#hdr','Header'],['section.pdp','Gallery and buy box'],['#upclose','Up close'],['#details','Details'],['#fit','@#fitH'],['#story','The meaning'],['#theset','@#setH'],['#charms','Build your necklace'],['section[aria-labelledby=\"relH\"]','@#relH'],['#questions','Questions'],['#reviews','Reviews'],['.nlb','Newsletter'],['.ftr','Footer']]\n  };\n  const css = `.sref-layer{position:absolute;left:0;top:0;width:100%;height:0;z-index:44;pointer-events:none}\n  .sref{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:6px;font:500 11px/1 Poppins,system-ui,sans-serif;color:#F6F6F3}\n  .sref b{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#232326;box-shadow:0 0 0 1.5px #F6F6F3,0 4px 12px -4px rgba(35,35,38,.5);font-weight:500;cursor:pointer}\n  .sref span{display:none;height:22px;align-items:center;padding:0 10px;border-radius:999px;background:#232326;box-shadow:0 0 0 1.5px #F6F6F3;white-space:nowrap;letter-spacing:.02em}\n  .sref:hover span,.sref.on span{display:inline-flex}\n  .sref.on b{background:#3CD694;color:#232326}\n  body.sref-off .sref-layer,body.sref-off .sref{display:none}\n  .sref.sref-in{left:4px;top:50%;transform:translateY(-50%);z-index:5}\n  .sref-tog{position:fixed;right:16px;bottom:16px;z-index:61;height:34px;padding:0 14px;border-radius:999px;background:#232326;color:#F6F6F3;font:400 12px/1 Poppins,system-ui,sans-serif;box-shadow:0 10px 24px -12px rgba(35,35,38,.6);display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0}\n  .sref-tog i{width:8px;height:8px;border-radius:50%;background:#3CD694}\n  body.sref-off .sref-tog i{background:#6B6B70}\n  body.mm-on .sref-tog{visibility:hidden}\n  @media (max-width:960px){ .sref-tog{bottom:86px} }`;\n  function page(){ if(document.getElementById('pT')) return 'product'; if(document.getElementById('grid') && document.getElementById('toolbar')) return 'collection'; if(document.getElementById('hero')) return 'home'; return null; }\n  function visible(el){ if(!el || el.hidden || el.closest('[hidden]')) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }\n  let layer, items = [], raf = 0;\n  function build(){\n    const k = page(); if(!k) return;\n    const type = k === 'product' ? ((document.querySelector('#mockSw [aria-pressed=\"true\"]') || {}).textContent || '').trim().toUpperCase() : '';\n    const prefix = k === 'home' ? 'HOME' : k === 'collection' ? 'COLLECTION' : 'PRODUCT' + (type ? ' ' + type : '');\n    items = []; let n = 0;\n    document.querySelectorAll('.sref-in').forEach(x => x.remove());\n    PAGES[k].forEach(([sel, name]) => {\n      document.querySelectorAll(sel).forEach(el => {\n        if(!visible(el)) return; n++;\n        const nm = name.startsWith('@') ? ((document.querySelector(name.slice(1)) || {}).textContent || '').trim() : name;\n        items.push({el, label:`${prefix} S${n} \u00b7 ${nm}`, n});\n      });\n    });\n    /* the announcement bar and the header sit above the page, so their dots go inside them; the rest go on a layer */\n    const dot = (it, i, cls) => `<div class=\"sref${cls}\" data-i=\"${i}\"><b role=\"button\" tabindex=\"0\" aria-label=\"${it.label}\">${it.n}<\/b><span>${it.label}<\/span><\/div>`;\n    layer.innerHTML = items.map((it, i) => INSIDE(it.el) ? '' : dot(it, i, '')).join('');\n    items.forEach((it, i) => { if(INSIDE(it.el)) it.el.insertAdjacentHTML('beforeend', dot(it, i, ' sref-in')); });\n    place();\n  }\n  const INSIDE = el => el.id === 'ann' || el.id === 'hdr';\n  /* copy the reference; inside the one-file mockup the clipboard API can be blocked, so fall back to a hidden field */\n  function copy(t){ const fb = () => { try { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0;left:-99px'; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch(e) {} };\n    try { navigator.clipboard.writeText(t).catch(fb); } catch(e) { fb(); } }\n  /* the home header floats over the hero: dots that would land under it move just below it */\n  function cover(){ const h = document.getElementById('hdr'), a = document.getElementById('ann'); if(!h || getComputedStyle(h).position !== 'fixed') return 0; return (a ? a.offsetHeight : 0) + h.offsetHeight; }\n  function place(){\n    cancelAnimationFrame(raf);\n    raf = requestAnimationFrame(() => { const sx = scrollX, sy = scrollY, c = cover(); [...layer.children].forEach(d => { const it = items[+d.dataset.i]; if(!it) return; const r = it.el.getBoundingClientRect();\n      d.style.left = Math.max(4, r.left + sx - 14) + 'px'; d.style.top = Math.max(r.top + sy + 6, c ? c + 8 : 0) + 'px'; }); });\n  }\n  addEventListener('DOMContentLoaded', () => {\n    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);\n    layer = document.createElement('div'); layer.className = 'sref-layer'; layer.setAttribute('aria-label', 'Section references'); document.body.appendChild(layer);\n    const tog = document.createElement('button'); tog.className = 'sref-tog'; tog.type = 'button'; tog.innerHTML = '<i><\/i>Sections'; document.body.appendChild(tog);\n    tog.addEventListener('click', () => document.body.classList.toggle('sref-off'));\n    document.addEventListener('click', e => { const d = e.target.closest('.sref'); if(!d) return; e.preventDefault(); e.stopPropagation(); const on = !d.classList.contains('on'); document.querySelectorAll('.sref').forEach(x => x.classList.remove('on')); if(on){ d.classList.add('on'); const t = items[+d.dataset.i].label; copy(t); } }, true);\n    document.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.sref')){ e.preventDefault(); e.target.click(); } });\n    setTimeout(build, 300);\n    let t; const again = () => { clearTimeout(t); t = setTimeout(build, 250); };\n    new ResizeObserver(again).observe(document.body);\n    addEventListener('resize', again); addEventListener('load', again);\n    const g = document.getElementById('grid'); if(g) new MutationObserver(again).observe(g, {childList:true});\n    document.addEventListener('click', e => { if(e.target.closest('[data-type], .more-btn, summary, [data-o]')) again(); });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  const mm = document.getElementById('mmenu'), btn = document.getElementById('menuBtn');\n  if(!mm || !btn) return;\n  function build(){\n    const SECT = [['shop','Shop'],['colls','Collections'],['explore','Explore']];\n    document.getElementById('mmAcc').innerHTML = SECT.map(([id, name]) => {\n      const m = document.getElementById('mega-' + id); if(!m) return '';\n      let groups = [...m.querySelectorAll('.mega-grid > div:not(.mega-feat)')].map(d => ({h:(d.querySelector('h4') || {}).textContent || '', links:[...d.querySelectorAll('a')].map(a => [a.getAttribute('href'), a.textContent.trim()])}));\n      if(id === 'colls') groups = [{h:'', links:[...m.querySelectorAll('a')].map(a => [a.getAttribute('href'), ((a.querySelector('b') || a).firstChild || {}).textContent || a.textContent])}];\n      return `<details name=\"mm\"><summary>${name}<i aria-hidden=\"true\"><\/i><\/summary><div class=\"mm-in\">${groups.map(g => `<div class=\"mm-g\">${g.h ? `<h4>${g.h}<\/h4>` : ''}<ul>${g.links.map(([h, t]) => `<li><a href=\"${h}\" data-close>${t.trim()}<\/a><\/li>`).join('')}<\/ul><\/div>`).join('')}<\/div><\/details>`;\n    }).join('');\n  }\n  /* the bag count shows only when there is something in the bag */\n  function bagBadge(){ const n = document.getElementById('bagN'); if(n) n.hidden = (n.textContent.trim() === '0' || !n.textContent.trim()); }\n  addEventListener('DOMContentLoaded', () => {\n    build(); bagBadge();\n    const n = document.getElementById('bagN'); if(n) new MutationObserver(bagBadge).observe(n, {childList:true, characterData:true, subtree:true});\n    if(typeof panels !== 'undefined' && panels.menu) return;   /* the home drives the menu with its own panels */\n    const hdr = document.getElementById('hdr');\n    const open = () => { mm.classList.add('on'); document.body.classList.add('locked', 'mm-on'); btn.setAttribute('aria-expanded', true); btn.textContent = 'Close'; if(hdr) hdr.classList.remove('up'); document.body.classList.remove('hdr-up'); };\n    const close = () => { mm.classList.remove('on'); document.body.classList.remove('locked', 'mm-on'); btn.setAttribute('aria-expanded', false); btn.textContent = 'Menu'; };\n    btn.addEventListener('click', () => mm.classList.contains('on') ? close() : open());\n    /* search, on pages that do not have the home's panels */\n    const sp = document.getElementById('search');\n    if(sp){ document.addEventListener('click', e => { if(e.target.closest('[data-open=\"search\"]')){ close(); sp.classList.add('on'); setTimeout(() => { const q = document.getElementById('q'); if(q) q.focus(); }, 350); } else if(e.target.closest('#search [data-close]') || (sp.classList.contains('on') && !e.target.closest('#search'))) sp.classList.remove('on'); });\n      addEventListener('keydown', e => { if(e.key === 'Escape'){ sp.classList.remove('on'); close(); } }); }\n    mm.addEventListener('click', e => { if(e.target.closest('[data-close]')) close(); });\n  });\n})();\n<\/script>\n\n<div class=\"pbar\" id=\"pbar\" aria-hidden=\"true\">\n  <div class=\"in wrap\">\n    <div class=\"pi\"><span><img id=\"pbImg\" alt=\"\"><\/span><div><b id=\"pbT\"><\/b><small id=\"pbSub\"><\/small><\/div><\/div>\n    <nav aria-label=\"On this page\" id=\"pbNav\"><\/nav>\n    <div class=\"r\"><span class=\"money\" id=\"pbPrice\"><\/span><button class=\"pill\" data-buy tabindex=\"-1\">Add to bag<\/button><\/div>\n  <\/div>\n<\/div>\n\n<main>\n<nav class=\"crumbs wrap\" aria-label=\"Breadcrumb\" id=\"crumbs\"><\/nav>\n\n<section class=\"pdp wrap\" aria-label=\"Product\">\n  <div class=\"galw\">\n    <div class=\"gal\" id=\"gal\" aria-label=\"Images\"><\/div>\n    <div class=\"g-count\" id=\"gCount\" aria-hidden=\"true\"><\/div>\n  <\/div>\n\n  <div class=\"buy\" id=\"buy\">\n    <div class=\"ttl\">\n      <div><h1 id=\"pT\"><\/h1><p class=\"tagl\" id=\"pTag\"><\/p><\/div>\n      <button class=\"favb\" id=\"favb\" aria-pressed=\"false\" aria-label=\"Save this piece\"><svg viewBox=\"0 0 20 20\"><path d=\"M10 17s-6.5-4-6.5-8.6A3.7 3.7 0 0 1 10 6.3a3.7 3.   const boot = BRIDGE.replace('%s', JSON.stringify(qs)).replace('%s', JSON.stringify(at)).replace('%s', JSON.stringify(STATE).replace(/</g, '\\u003c'));
  frame.srcdoc = PAGES[page].replace('__BRIDGE__', boot);
}
frame.addEventListener('load', () => { try { document.title = frame.contentDocument.title; frame.contentWindow.focus(); } catch(e) {} });
addEventListener('message', e => {
  if(e.data && e.data.state){ STATE = e.data.state; try { sessionStorage.setItem('abd-state', JSON.stringify(STATE)); } catch(err) {} return; }
  if(!e.data || !e.data.go) return; location.hash = '/' + e.data.go + (e.data.qs || '') + (e.data.at ? '@' + e.data.at : ''); });
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
